# Wi-Fi that stays connected.
#
# Two defaults cost this image a working link:
#
# wifi.powersave defaults to 3 (let the driver decide), and on the Broadcom
# and Intel parts in laptops that means the radio sleeps between beacons. The
# access point ages the association out and the machine comes back as an
# unauthenticated client — which looks exactly like "it disconnected and asked
# for the password again".
#
# wifi.cloned-mac-address defaults to "preserve" in Debian, but scanning still
# randomises. Some access points and captive portals treat a changed MAC as a
# new device and drop the lease. Staying with the hardware address is the
# boring, predictable choice for a machine that has to just work.
[connection]
wifi.powersave=2
wifi.cloned-mac-address=permanent

[device]
wifi.scan-rand-mac-address=no
