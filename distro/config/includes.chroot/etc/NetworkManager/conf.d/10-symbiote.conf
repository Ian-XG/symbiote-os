# Wi-Fi that stays connected.
#
# The shell already makes the *profile* stick: the passphrase is stored, the
# network autoconnects, and a manual disconnect no longer blocks it. That is a
# different problem from the link going down on its own, and this is the other
# half.
#
# wifi.powersave defaults to 3, "let the driver decide", and on the Broadcom
# and Intel parts in laptops that means the radio sleeps between beacons. The
# access point ages the association out and the machine comes back as an
# unauthenticated client — which on screen is indistinguishable from a
# passphrase that was never saved. Chasing the profile alone would never have
# fixed it.
#
# MAC randomisation is the same shape of problem: some access points and
# captive portals treat a changed address as a new device and drop the lease.
[connection]
wifi.powersave=2
wifi.cloned-mac-address=permanent

[device]
wifi.scan-rand-mac-address=no
