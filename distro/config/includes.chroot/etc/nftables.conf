#!/usr/sbin/nft -f
#
# Default policy for Symbiote OS.
#
# The SECURITY panel reported "FIREWALL: NOT RUNNING" from the first boot, and
# it was telling the truth: nftables was not installed and no ruleset existed.
# A penetration-testing image with every inbound port open is the wrong way
# round — the tools here are for reaching out, not for being reached.
#
# Inbound is denied by default. Outbound is unrestricted, because the whole
# point of the toolset is to make connections. Replies to connections this
# machine opened are allowed back in, which is what makes that workable.

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		# Traffic belonging to a connection we opened.
		ct state established,related accept
		ct state invalid drop

		# The loopback interface is this machine talking to itself.
		iif lo accept

		# ICMP is how the network tells us things: path MTU discovery breaks
		# silently without it, which looks like "some sites just hang".
		ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded, parameter-problem } accept
		ip6 nexthdr icmpv6 icmpv6 type { echo-request, echo-reply, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

		# DHCP replies arrive before there is a connection to belong to, so
		# they have to be named explicitly or the machine never gets a lease.
		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept

		# mDNS, so printers and local devices resolve.
		udp dport 5353 accept

		# Anything else is refused rather than dropped on the local network:
		# a reject is honest and fast, a drop makes every local tool wait for
		# a timeout.
		iifname != lo ct state new reject with icmpx type admin-prohibited
	}

	chain forward {
		# This is a laptop, not a router.
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
