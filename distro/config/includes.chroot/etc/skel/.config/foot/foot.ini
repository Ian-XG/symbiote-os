# Terminal styled to match the Symbiote HUD: toxin green on near-black,
# JetBrains Mono, square corners, no padding fighting the HUD behind it.

font=JetBrains Mono:size=10
line-height=15
pad=14x12
dpi-aware=no
selection-target=clipboard

[cursor]
style=block
blink=yes
color=080808 00ff88

[colors]
alpha=0.92
background=080808
foreground=c8c8c8

# normal
regular0=1c1f1c
regular1=ff1744
regular2=00ff88
regular3=1aff00
regular4=04412a
regular5=00ff88
regular6=00d9a0
regular7=c8c8c8

# bright
bright0=6b6f6b
bright1=ff4d6d
bright2=4dffab
bright3=6bff5c
bright4=0a6b45
bright5=4dffab
bright6=4dffd4
bright7=ffffff

selection-foreground=080808
selection-background=00ff88
urls=1aff00

[csd]
# Client-side decorations in the HUD palette rather than the default grey.
preferred=server
color=ff080808
border-width=1
border-color=ff00ff88
button-width=26
button-color=ff080808
button-minimize-color=ff6b6f6b
button-maximize-color=ff00ff88
button-close-color=ffff1744

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+plus
font-decrease=Control+minus
