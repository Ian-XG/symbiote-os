# mpv, in the shell's colours.
#
# Chosen over a full media application because it is small, plays everything,
# and its on-screen controls can be recoloured — a GNOME video player would
# bring its own chrome and ignore the palette.

# Wayland natively; without this it goes through XWayland and looks soft.
gpu-context=wayland
hwdec=auto-safe

# Do not resize the window to each file's resolution; on a laptop that means a
# video jumping between postage stamp and full screen between clips.
autofit-larger=85%x85%
keep-open=yes

background=#080808
osd-font=JetBrains Mono
osd-font-size=28
osd-color=#C8C8C8
osd-border-color=#080808
osd-bar-align-y=0.85
osd-bar-h=2
osd-bar-w=60

# Subtitles in the same typeface as everything else.
sub-font=JetBrains Mono
sub-color=#C8C8C8
sub-border-color=#080808
sub-border-size=2
