# What the lid and the power button do.
#
# Nothing configured this, so the machine ran on systemd's defaults. On a live
# image that is the wrong shape in two directions at once:
#
#   - Closing the lid suspended the machine. Suspending a live USB session is
#     a good way to lose it: resume has to bring back a root filesystem that
#     lives on a stick the user may well have moved, and the overlay holding
#     everything they have done since boot is in RAM. Closing the lid to carry
#     a laptop across a room should not risk the session.
#
# The shell's idle watchdog already handles blanking and locking on a timer;
# this is only about the physical switches.

[Login]
# Lock, do not suspend. The screen goes off; the session stays up.
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
# Docked with the lid shut and an external monitor attached: do nothing at all,
# or the desktop locks itself every time the laptop is put back on its stand.
HandleLidSwitchDocked=ignore

# The power button shuts down cleanly, which is the default and stays the
# default. It was tempting to set this to ignore and route it through the
# desktop's session menu instead, so a live session could not be thrown away
# by one keypress — but nothing in this image listens for that key, so ignore
# would mean a power button that does nothing at all. A button that appears
# broken is a worse trade than a button that works and is a little abrupt.
HandlePowerKey=poweroff
HandleSuspendKey=suspend
HandleHibernateKey=ignore

# A live session has no home directory to come back to; leaving processes
# running after the session ends only keeps the overlay pinned.
KillUserProcesses=no
