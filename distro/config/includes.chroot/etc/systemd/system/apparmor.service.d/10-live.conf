# Load AppArmor profiles on a live boot too.
#
# Debian's apparmor.service carries
#
#     ConditionPathExists=!/run/live/overlay/work
#
# which means "do not run when booted from live media". So on every boot of
# this image the unit was skipped before it started, and 126 profile files sat
# on disk doing nothing. The service showed as enabled, `aa-status` reported
# the module loaded and zero profiles, and nothing anywhere said why. An image
# that installs apparmor, apparmor-profiles and apparmor-utils and confines
# nothing is three packages of decoration.
#
# An empty assignment clears the inherited list, which is systemd's documented
# way to drop a condition from a drop-in.
#
# Tested on the live image before shipping, because the condition exists for a
# reason and the reason might still hold:
#
#   - 131 profiles load, 11 in enforce mode -- tcpdump, system_tor, papers and
#     its helpers among them.
#   - The desktop is unaffected: shell and compositor keep running.
#   - Papers is the only confined desktop application, and it opens a real PDF
#     and renders it in full, outline and all.
#   - Three denials at startup, all from Papers: a /sys uevent read and a
#     /dev/udmabuf open, both of which it falls back from. Opening a document
#     afterwards adds none.
[Unit]
ConditionPathExists=
